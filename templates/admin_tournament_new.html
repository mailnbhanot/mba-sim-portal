{% extends "base.html" %}
{% block body %}
<h1>New tournament</h1>
<p class="sub">You enrol students on the next screen. Only enrolled students can enter the game.</p>
<div class="card" style="max-width:640px">
<form method="post">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Game</label>
  <select name="game">{% for g in all_games() %}<option value="{{ g.key }}">{{ g.course_code }} {{ g.title }} ({{ g.implemented_rounds|length }} of {{ g.total_rounds }} rounds built)</option>{% endfor %}</select>
  <label>Name</label><input name="name" required style="width:100%" placeholder="e.g. MKTM679 Section A, Nov 2026">
  <label>Who plays</label>
  <select name="participation"><option value="individual">Individual: each student runs their own company</option><option value="team">Teams: a team of students runs one company together</option></select>
  <label>Students per team (teams only; used for students you do not place in a team yourself)</label><input type="number" name="team_size" value="4" min="2" max="12">
  <label>Round control</label>
  <select name="mode"><option value="manual">Manual: I click "Process round"</option><option value="auto">Automatic: rounds close at a deadline</option></select>
  <label>Hours per round (automatic mode)</label><input type="number" name="interval_hours" value="48" min="1">
  <label>Markets</label>
  <select name="market_mode"><option value="single">Single market: everyone competes together</option><option value="groups">Industry groups: small markets that compete directly (best for classes over 60)</option></select>
  <label>Students per group (groups only)</label><input type="number" name="group_size" value="10" min="3" max="60">
  <label>Ranking: weight of profit (%). The rest is market share.</label><input type="number" name="rank_w_profit" value="60" min="0" max="100">
  <label>Starting cash (Rs)</label><input type="number" name="start_cash" value="5000000" min="500000" step="100000">
  <p><button>Create tournament</button></p>
</form>
</div>
{% endblock %}
