{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block body %}
<div class="card login">
  <h1>Log in</h1>
  <p class="sub">Use the username and password your teacher gave you.</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Username</label><input name="username" autocomplete="username" autofocus required style="width:100%">
    <label>Password</label><input name="password" type="password" autocomplete="current-password" required style="width:100%">
    <p><button>Log in</button></p>
  </form>
</div>
{% endblock %}
