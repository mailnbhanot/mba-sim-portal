services:
  - type: web
    name: mktm679-sim
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: TICK_SECRET
        generateValue: true
      - key: SECURE_COOKIES
        value: "1"
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false      # you type this in the Render dashboard
      - key: DATABASE_URL
        sync: false      # paste the Supabase connection string
